[project]
name = "quant-strategy"
version = "0.1.0"
description = "Project Darwin: Quantitative Trading Strategy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "finance-datareader>=0.9.100",
    "joblib>=1.5.3",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "pykrx>=1.0.51",
    "schedule>=1.2.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "tabulate>=0.9.0",
    "torch>=2.9.1",
    "xgboost>=3.1.2",
    "yfinance>=1.0",
]

[project.scripts]
quant = "quant_strategy.presentation.cli.main:main"

# [추가됨] 빌드 시스템 정의 (setuptools 사용 시 필수)
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# [추가됨] src 레이아웃 설정
# src 폴더 밑에 있는 패키지들을 자동으로 찾아서 설치합니다.
[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false
